<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THE BUFF® QUEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:ital,wght@0,400;0,800;1,800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --text-muted: #555;
    --grad-purple: #7a2c9e;
    --grad-pink: #dd5789;
    --grad-yellow: #fedc2a;
    --buff-yellow: #f5a623;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 460px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ── TITLE ── */
  .title-block {
    text-align: center;
    padding: 40px 0 4px;
  }

  .title-wrapper {
    position: relative;
    display: inline-block;
    overflow: visible;
    padding-top: 8px;
  }

  .title-line {
    display: block;
  }

  .title-main-shadow {
    font-family: 'Saira Extra Condensed', sans-serif;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(60px, 19vw, 96px);
    line-height: 0.88;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: rgba(0,0,0,0.07);
    position: absolute;
    top: 11px;
    left: 4px;
    width: 100%;
    text-align: center;
    z-index: 0;
    pointer-events: none;
  }

  .title-main {
    font-family: 'Saira Extra Condensed', sans-serif;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(60px, 19vw, 96px);
    line-height: 0.88;
    text-transform: uppercase;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--grad-yellow) 0%, var(--grad-pink) 50%, var(--grad-purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
    z-index: 1;
  }

  .reg-mark {
    font-size: 0.38em;
    vertical-align: super;
    line-height: 0;
    letter-spacing: 0;
  }

  .subtitle {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(14px, 4vw, 19px);
    color: var(--text);
    margin-top: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .instruction {
    text-align: center;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-muted);
    margin: 16px 0 4px;
  }

  /* ── PROGRESS ── */
  .progress-section {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    padding: 10px 0 10px;
    max-width: 460px;
    margin: 0 auto;
  }

  .progress-text {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 5px;
    text-align: right;
  }

  .progress-bar-track {
    height: 5px;
    background: rgba(0,0,0,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--grad-yellow), var(--grad-pink), var(--grad-purple));
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: 0%;
  }

  /* ── QUEST CARDS ── */
  .quest-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 0 140px;
  }

  .quest-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: all 0.2s ease;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }

  .quest-card:active { transform: scale(0.98); }

  .quest-card.checked {
    border-color: var(--buff-yellow);
    background: #fffcf0;
  }

  /* Square checkbox with logo fill */
  .checkbox-square {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border: 2.5px solid var(--text);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    background: transparent;
    position: relative;
    overflow: hidden;
  }

  .quest-card.checked .checkbox-square {
    border-color: var(--buff-yellow);
    background: var(--buff-yellow);
    animation: stamp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes stamp {
    0% { transform: scale(0.5) rotate(-15deg); }
    60% { transform: scale(1.15) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .checkbox-logo {
    width: 30px;
    height: 30px;
    object-fit: cover;
    border-radius: 3px;
    opacity: 0;
    transform: scale(0) rotate(-20deg);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .quest-card.checked .checkbox-logo {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  .quest-label {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.4;
    flex: 1;
    transition: color 0.2s;
  }

  .quest-label a {
    color: var(--grad-purple);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .quest-card.checked .quest-label {
    color: var(--text-muted);
  }

  /* ── PRIZE BANNER ── */
  .prize-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 0 12px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    pointer-events: none;
  }

  .prize-inner {
    max-width: 460px;
    margin: 0 auto;
    background: linear-gradient(90deg, var(--grad-yellow), var(--grad-pink), var(--grad-purple));
    border-radius: 14px;
    padding: 14px 18px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    transform: translateY(calc(100% + 40px));
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: auto;
  }

  .prize-banner.visible .prize-inner { transform: translateY(0); }
  .prize-text { color: #fff; font-weight: 700; font-size: 15px; }
  .prize-sub { color: rgba(255,255,255,0.9); font-size: 12px; margin-top: 2px; }

  /* ── CELEBRATION ── */
  .celebration {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .celebration.active { opacity: 1; pointer-events: auto; }

  .celebration-card {
    background: var(--bg);
    border-radius: 20px;
    padding: 36px 24px;
    text-align: center;
    max-width: 300px;
    width: 88%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    transform: scale(0.8);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .celebration.active .celebration-card { transform: scale(1); }

  .celebration-logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 12px;
    animation: spinIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-radius: 12px;
  }

  @keyframes spinIn {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .celebration-title {
    font-family: 'Saira Extra Condensed', sans-serif;
    font-weight: 800;
    font-style: italic;
    font-size: 32px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--grad-yellow), var(--grad-pink), var(--grad-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .celebration-text {
    margin-top: 6px;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .celebration-btn {
    margin-top: 18px;
    padding: 12px 32px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(90deg, var(--grad-yellow), var(--grad-pink), var(--grad-purple));
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(221,87,137,0.3);
    transition: transform 0.2s;
  }

  .celebration-btn:active { transform: scale(0.96); }

  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 250;
  }

  .reset-btn {
    display: block;
    margin: 4px auto 0;
    padding: 8px 20px;
    border: 1.5px solid #ccc;
    border-radius: 50px;
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
</style>
</head>

<div class="confetti-container" id="confetti"></div>

<script>
const LOGO_SRC = document.getElementById('celebLogo').src;
const GOAL = 3;

const QUESTS = [
  { id: 'selfie-employee', text: 'Take a selfie with a Sports Basement employee or run leader' },
  { id: 'tag-ig', text: 'Tag @buffofficial and @sportsbasement in an Instagram story' },
  { id: 'selfie-start', text: 'Make a friend and take a selfie at the start line' },
  { id: 'selfie-display', text: 'Make a friend and take a selfie in front of the BUFF® display' },
  { id: 'compliment', text: 'Give someone a compliment' },
  { id: 'email', text: 'Sign up for the <a href="https://manage.kmail-lists.com/subscriptions/subscribe?a=TVi8vh&g=SW4S89" target="_blank" rel="noopener" onclick="event.stopPropagation()">BUFF® email list</a>' },
];

const SK = 'buff-quest-v4';
let state = (() => { try { const s = localStorage.getItem(SK); if (s) return JSON.parse(s); } catch(e){} return { checked: {} }; })();
const save = () => { try { localStorage.setItem(SK, JSON.stringify(state)); } catch(e){} };
const count = () => Math.min(Object.values(state.checked).filter(Boolean).length, GOAL);

let celebShown = false;

function render() {
  const list = document.getElementById('questList');
  list.innerHTML = '';

  QUESTS.forEach(q => {
    const card = document.createElement('div');
    card.className = 'quest-card' + (state.checked[q.id] ? ' checked' : '');
    card.innerHTML =
      '<div class="checkbox-square">' +
        '<img class="checkbox-logo" src="' + LOGO_SRC + '" alt="">' +
      '</div>' +
      '<div class="quest-label">' + q.text + '</div>';
    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      state.checked[q.id] = !state.checked[q.id];
      save();
      update();
    });
    list.appendChild(card);
  });

  const rb = document.createElement('button');
  rb.className = 'reset-btn';
  rb.textContent = 'Reset Quest';
  rb.addEventListener('click', () => { state = { checked: {} }; celebShown = false; save(); update(); });
  list.appendChild(rb);
}

function update() {
  render();
  const c = count();
  document.getElementById('progressText').textContent = c + ' of ' + GOAL + ' completed';
  document.getElementById('progressFill').style.width = (c / GOAL) * 100 + '%';

  const b = document.getElementById('prizeBanner');
  if (c >= GOAL) {
    b.classList.add('visible');
    if (!celebShown) { celebShown = true; setTimeout(() => { document.getElementById('celebration').classList.add('active'); confetti(); }, 350); }
  } else { b.classList.remove('visible'); celebShown = false; }
}

function closeCelebration() { document.getElementById('celebration').classList.remove('active'); }

function confetti() {
  const el = document.getElementById('confetti');
  el.innerHTML = '';
  const colors = ['#fedc2a','#dd5789','#7a2c9e','#f5a623','#fff','#ff6b6b','#f7a832'];
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('div');
    const sz = 5 + Math.random() * 8;
    p.style.cssText = 'position:absolute;top:-20px;left:' + (Math.random()*100) + '%;width:' + sz + 'px;height:' + sz + 'px;background:' + colors[Math.floor(Math.random()*colors.length)] + ';border-radius:' + (Math.random()>.5?'50%':'2px') + ';opacity:0;animation:cfall ' + (1.5+Math.random()*1.5) + 's ' + (Math.random()*0.5) + 's ease-out forwards;';
    el.appendChild(p);
  }
  if (!document.getElementById('cfs')) { const s=document.createElement('style'); s.id='cfs'; s.textContent='@keyframes cfall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}'; document.head.appendChild(s); }
  setTimeout(() => el.innerHTML = '', 4000);
}

update();
</script>
